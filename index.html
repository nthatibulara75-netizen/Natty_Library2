<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natty Library</title>
<style>body{font-family:Arial;margin:0;background:#f4f4f4}.top{background:#14532d;color:#fff;padding:15px;display:flex;justify-content:space-between}.box{max-width:900px;margin:20px auto;background:#fff;padding:20px;border-radius:10px}input,button{padding:10px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#14532d;color:#fff;border:none;border-radius:6px;cursor:pointer}.card{border:1px solid #ddd;padding:12px;border-radius:8px;margin:10px 0;display:flex;justify-content:space-between}.small{width:auto;padding:6px 10px;margin:2px}.del{background:#dc2626}.edit{background:#2563eb}</style></head>
<body><div class="top"><b>📚 Natty Library</b><span id="user"></span></div>
<div class="box" id="loginBox"><h2>Login</h2><p>Use <b>admin / admin123</b> or any Membership ID</p><input id="uname" placeholder="Username / Membership ID"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button></div>
<div class="box" id="app" style="display:none"><h2>Dashboard - <span id="count"></span> Books</h2><input id="search" placeholder="Search books..." onkeyup="render()"><h3>Add / Update Book</h3><input id="title" placeholder="Book Title"><input id="author" placeholder="Author"><input id="isbn" placeholder="ISBN"><input id="qty" type="number" placeholder="Quantity"><button onclick="saveBook()">Save Book</button><button onclick="logout()" style="background:#666">Logout</button><div id="list"></div></div>
<script>
let books=JSON.parse(localStorage.getItem('natty_books')||'[{"title":"Things Fall Apart","author":"Chinua Achebe","isbn":"12345","qty":5},{"title":"Purple Hibiscus","author":"Chimamanda Ngozi","isbn":"67890","qty":3}]');
let editIndex=-1;
function login(){let u=document.getElementById('uname').value;if(!u)return alert('Enter username');localStorage.setItem('natty_user',u);showApp();}
function logout(){localStorage.removeItem('natty_user');location.reload();}
function showApp(){let u=localStorage.getItem('natty_user');if(!u)return;document.getElementById('loginBox').style.display='none';document.getElementById('app').style.display='block';document.getElementById('user').innerText='Hi, '+u+' | Logout';render();}
function saveBook(){let t=document.getElementById('title').value,a=document.getElementById('author').value,i=document.getElementById('isbn').value,q=document.getElementById('qty').value;if(!t||!a)return alert('Title + Author needed');let b={title:t,author:a,isbn:i,qty:q||1};if(editIndex>=0){books[editIndex]=b;editIndex=-1;}else books.push(b);localStorage.setItem('natty_books',JSON.stringify(books));document.getElementById('title').value='';document.getElementById('author').value='';document.getElementById('isbn').value='';document.getElementById('qty').value='';render();}
function render(){let s=(document.getElementById('search').value||'').toLowerCase();let f=books.filter(b=>(b.title+b.author).toLowerCase().includes(s));document.getElementById('count').innerText=f.length;document.getElementById('list').innerHTML=f.map((b,idx)=>`<div class="card"><div><b>${b.title}</b><br>${b.author} - ISBN: ${b.isbn} - Qty: ${b.qty}</div><div><button class="small edit" onclick="editBook(${books.indexOf(b)})">Update</button><button class="small del" onclick="delBook(${books.indexOf(b)})">Delete</button></div></div>`).join('')||'<p>No books found</p>';}
function delBook(i){if(confirm('Delete this book?')){books.splice(i,1);localStorage.setItem('natty_books',JSON.stringify(books));render();}}
function editBook(i){let b=books[i];document.getElementById('title').value=b.title;document.getElementById('author').value=b.author;document.getElementById('isbn').value=b.isbn;document.getElementById('qty').value=b.qty;editIndex=i;window.scrollTo(0,0);}
showApp();
</script></body></html>
