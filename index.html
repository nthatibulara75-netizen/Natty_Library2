<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Natty Library</title>
<style>
body{margin:0;background:#f0f0f0;font-family:Arial}
.login{max-width:380px;margin:80px auto;background:white;padding:30px;border-radius:10px;text-align:center;box-shadow:0 0 10px #ccc}
.login h1{margin:0}.login p{color:#666;font-size:13px}
input{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;background:#e8eef5;border:none;border-radius:5px}
button{width:100%;padding:12px;background:#2e8b57;color:white;border:none;border-radius:5px;cursor:pointer;font-size:16px}
.top{background:#14532d;color:white;padding:15px;display:flex;justify-content:space-between}
.box{max-width:800px;margin:20px auto;background:white;padding:20px;border-radius:10px}
.card{border:1px solid #ddd;padding:10px;margin:10px 0;border-radius:8px}
.del{background:#dc2626}.edit{background:#2563eb}.small{width:auto;padding:6px 10px}
</style></head>
<body>
<div id="loginPage" class="login">
<h1>Natty Library</h1><p>Sign in to continue</p>
<div style="text-align:left;font-size:12px">Membership ID</div>
<input id="mid" value="NATTY001">
<div style="text-align:left;font-size:12px">Password</div>
<input id="pwd" type="password" value="admin123">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<div id="dash" style="display:none">
<div class="top"><b>Natty Library</b><span id="hi"></span></div>
<div class="box">
<h2>Dashboard - <span id="count"></span> Books</h2>
<input id="search" placeholder="Search books..." onkeyup="render()">
<h3>Add / Update Book</h3>
<input id="title" placeholder="Book Title">
<input id="author" placeholder="Author">
<input id="isbn" placeholder="ISBN">
<input id="qty" type="number" placeholder="Quantity">
<button onclick="saveBook()">Save Book</button>
<button onclick="logout()" style="background:#666;margin-top:5px">Logout</button>
<div id="list"></div>
</div></div>

<script>
var books=JSON.parse(localStorage.getItem('natty_books')||'[]');
if(books.length==0){books=[{title:'Things Fall Apart',author:'Chinua Achebe',isbn:'12345',qty:5},{title:'Purple Hibiscus',author:'Chimamanda Ngozi',isbn:'67890',qty:3}];}
var editIndex=-1;
function login(){
var u=document.getElementById('mid').value;
if(!u){document.getElementById('msg').innerHTML='Enter Membership ID';return;}
localStorage.setItem('natty_user',u);
showApp();
}
function logout(){localStorage.removeItem('natty_user');location.reload();}
function showApp(){
var u=localStorage.getItem('natty_user');if(!u)return;
document.getElementById('loginPage').style.display='none';
document.getElementById('dash').style.display='block';
document.getElementById('hi').innerHTML='Hi, '+u;
render();
}
function saveBook(){
var t=document.getElementById('title').value;
var a=document.getElementById('author').value;
var i=document.getElementById('isbn').value;
var q=document.getElementById('qty').value;
if(!t||!a){alert('Title + Author needed');return;}
var b={title:t,author:a,isbn:i,qty:q||1};
if(editIndex>=0){books[editIndex]=b;editIndex=-1;}else{books.push(b);}
localStorage.setItem('natty_books',JSON.stringify(books));
document.getElementById('title').value='';document.getElementById('author').value='';document.getElementById('isbn').value='';document.getElementById('qty').value='';
render();
}
function render(){
var s=document.getElementById('search').value.toLowerCase();
var html='';var shown=0;
for(var k=0;k<books.length;k++){var b=books[k];
if((b.title+b.author).toLowerCase().indexOf(s)==-1)continue;
shown++;
html+='<div class="card"><b>'+b.title+'</b><br>'+b.author+' - ISBN: '+b.isbn+' - Qty: '+b.qty+'<br><button class="small edit" onclick="editBook('+k+')">Update</button> <button class="small del" onclick="delBook('+k+')">Delete</button></div>';}
document.getElementById('count').innerHTML=shown;
document.getElementById('list').innerHTML=html||'<p>No books</p>';
}
function delBook(i){if(confirm('Delete this book?')){books.splice(i,1);localStorage.setItem('natty_books',JSON.stringify(books));render();}}
function editBook(i){var b=books[i];document.getElementById('title').value=b.title;document.getElementById('author').value=b.author;document.getElementById('isbn').value=b.isbn;document.getElementById('qty').value=b.qty;editIndex=i;window.scrollTo(0,0);}
showApp();
</script></body></html>
